<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadência 12</title>
<meta name="description" content="Programa de 12 semanas de bike indoor com aula guiada, ofensiva diária e evolução de VO2.">
<meta name="theme-color" content="#080B11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F5F9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadência 12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#E7ECF4; --line:#D2DAE6;
  --text:#0C1420; --muted:#57657A; --accent:#D9500B; --accent-ink:#FFFFFF; --accent-soft:#FFE7D6;
  --z1:#2F7BE8; --z2:#0C9A6C; --z3:#C79104; --z4:#D9500B; --z5:#C81745;
  --good:#0C9A6C; --warn:#C79104; --shadow:0 1px 2px rgba(12,20,32,.08), 0 8px 24px rgba(12,20,32,.06);
  --badge-ink:#FFFFFF;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080B11; --surface:#111721; --surface2:#1A2230; --line:#27313F;
    --text:#E7EDF6; --muted:#8B98AC; --accent:#FF7A29; --accent-ink:#160800; --accent-soft:#3A1F0E;
    --z1:#4C9AFF; --z2:#19C98A; --z3:#F0BA2A; --z4:#FF7A29; --z5:#FF3D6E;
    --good:#19C98A; --warn:#F0BA2A; --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
    --badge-ink:#08111B;
  }
}
:root[data-theme="dark"]{
  --bg:#080B11; --surface:#111721; --surface2:#1A2230; --line:#27313F;
  --text:#E7EDF6; --muted:#8B98AC; --accent:#FF7A29; --accent-ink:#160800; --accent-soft:#3A1F0E;
  --z1:#4C9AFF; --z2:#19C98A; --z3:#F0BA2A; --z4:#FF7A29; --z5:#FF3D6E;
  --good:#19C98A; --warn:#F0BA2A; --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
  --badge-ink:#08111B;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
}
h1,h2,h3{font-family:Archivo,"Arial Narrow",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{font-family:Archivo;font-weight:900;font-stretch:118%;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.chip.flame{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sync{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- level bar ---------- */
.levelbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.levelbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--z5))}

/* ---------- zone rail ---------- */
.rail{display:flex;height:12px;border-radius:4px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.rail div{height:100%}
.zlegend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.zdot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- today hero ---------- */
.hero{position:relative;overflow:hidden}
.hero .glow{position:absolute;inset:-40% -20% auto -20%;height:220px;background:radial-gradient(60% 100% at 50% 0%,var(--accent) 0%,transparent 70%);opacity:.16;pointer-events:none}
.hero h2{font-size:30px;font-weight:900;font-stretch:112%;line-height:1.02;text-transform:uppercase;position:relative}
.metagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.metagrid .m{background:var(--surface2);border-radius:10px;padding:9px 10px}
.metagrid .m b{display:block;font-family:"IBM Plex Mono";font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.metagrid .m span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;letter-spacing:.01em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);font-size:14px;padding:12px}
.btn.done{background:var(--good);color:#04150E}

/* ---------- block list ---------- */
table.blocks{width:100%;border-collapse:collapse;font-size:13px}
table.blocks th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.blocks td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.blocks tr:last-child td{border-bottom:0}
.zbadge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;color:var(--badge-ink)}
.tscroll{overflow-x:auto}

/* ---------- weeks ---------- */
details.week{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
details.week+details.week{margin-top:10px}
details.week>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:10px}
details.week>summary::-webkit-details-marker{display:none}
.wtag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface2);color:var(--muted)}
.wtag.dl{background:var(--accent-soft);color:var(--accent)}
.daylist{border-top:1px solid var(--line)}
.dayrow{display:flex;gap:11px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.dayrow:last-child{border-bottom:0}
.dayrow .dn{font-family:"IBM Plex Mono";font-size:11px;font-weight:600;color:var(--muted);width:26px;flex:none;text-transform:uppercase}
.dayrow .nm{flex:1;min-width:0}
.dayrow .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .nm i{font-style:normal;font-size:11.5px;color:var(--muted)}
.tick{width:30px;height:30px;border-radius:99px;border:2px solid var(--line);flex:none;background:transparent;padding:0;position:relative}
.tick::after{content:"";position:absolute;left:9px;top:7px;width:7px;height:12px;border:solid var(--muted);border-width:0 2px 2px 0;transform:rotate(42deg);opacity:.35}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on::after{border-color:#04150E;opacity:1}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav.tabs button{background:none;border:0;padding:11px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}

/* ---------- player ---------- */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#player.on{display:flex}
#player .pglow{position:absolute;inset:0;pointer-events:none;transition:background .6s ease;opacity:.2}
#player .phead{position:relative;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
#player .pbody{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 20px;gap:6px;overflow:hidden}
.ptag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:var(--badge-ink)}
.ptime{font-family:"IBM Plex Mono";font-size:clamp(60px,20vw,112px);font-weight:600;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pblockbar{width:min(320px,72vw);height:5px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:2px 0 8px}
.pblockbar i{display:block;height:100%;background:currentColor;transition:width .2s linear}
.pcue{font-family:Archivo;font-weight:900;font-stretch:110%;text-transform:uppercase;font-size:clamp(19px,5.4vw,28px);line-height:1.05}
.pmot{font-size:14.5px;color:var(--muted);max-width:34ch;min-height:2.6em;line-height:1.35;transition:opacity .35s ease}
.pprog{height:3px;background:var(--surface2);position:relative;z-index:2}
.pprog i{display:block;height:100%;background:var(--accent);width:0}
.prep{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:20px;background:var(--bg)}
.prep::before{content:"";position:absolute;inset:0;background:radial-gradient(65% 45% at 50% 45%,currentColor 0%,transparent 72%);opacity:.22;pointer-events:none}
.prep>*{position:relative}
.prep.on{display:flex}
.prepnum{font-family:"IBM Plex Mono";font-size:clamp(64px,24vw,128px);font-weight:600;line-height:1;color:currentColor}
.prepinstr{font-family:Archivo,"Arial Narrow",system-ui,sans-serif;font-weight:900;font-stretch:118%;text-transform:uppercase;font-size:clamp(24px,7.2vw,40px);line-height:1.02;letter-spacing:.01em;color:var(--text);max-width:16ch}
.prepdet{font-family:"IBM Plex Mono";font-size:15px;color:var(--muted);margin-top:6px}
.preplabel{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ptargets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:420px;margin-top:8px}
.ptargets div{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 6px}
.ptargets b{display:block;font-family:"IBM Plex Mono";font-size:19px;font-weight:600}
.ptargets span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pnext{font-size:13px;color:var(--muted);margin-top:10px}
.prail{display:flex;gap:2px;height:18px;padding:0 16px;position:relative}
.prail div{flex:none;border-radius:2px;opacity:.3;transition:opacity .2s}
.prail div.done{opacity:.65}
.prail div.now{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 3px currentColor}
.pfoot{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pfoot button{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.pfoot button.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:70;background:rgba(4,7,12,.62);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;border:1px solid var(--line);border-bottom:0}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- progress ---------- */
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.stat b{display:block;font-family:"IBM Plex Mono";font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center;opacity:.38}
.badge.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.badge .ic{font-size:22px;line-height:1.3}
.badge b{display:block;font-size:11.5px;font-weight:700;margin-top:2px}
.badge i{font-style:normal;font-size:10px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px}
.bars .b{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--surface2);border-radius:4px;overflow:hidden}
.bars .b i{display:block;width:100%;background:linear-gradient(180deg,var(--accent),var(--z5));border-radius:4px;min-height:2px}
.barlabels{display:flex;gap:5px;font-size:9.5px;color:var(--muted);margin-top:4px}
.barlabels span{flex:1;text-align:center}

.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;font-size:13.5px}
.celebrate{text-align:center;padding:10px 0 4px}
.celebrate .big{font-family:Archivo;font-weight:900;font-stretch:115%;text-transform:uppercase;font-size:32px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pl 1.6s ease-in-out infinite}
  @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand">Cadência<span>12</span></div>
    <div class="spacer"></div>
    <div class="chip flame" id="chipStreak">🔥 0</div>
    <div class="chip" id="chipXp">0 XP</div>
  </div>
</header>

<main class="wrap" id="view" style="padding-top:16px"></main>

<nav class="tabs">
  <div class="wrap">
    <button data-tab="hoje" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-8h5l3 8M10 9l-1-3H7m3 3h6"/></svg>Hoje</button>
    <button data-tab="programa"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v3M16 2.5v3M7.5 13h4M7.5 17h9"/></svg>Programa</button>
    <button data-tab="progresso"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16v-5M12.5 16V8M17 16v-3"/></svg>Progresso</button>

  </div>
</nav>

  <div class="pglow"></div>
  <div class="pprog"><i id="pProg"></i></div>
  <div class="phead">
    <strong id="pName" style="font-size:14px">—</strong>

<script>
"use strict";

/* ================= PROGRAMA ================= */
const ZONES = {
  1:{n:"Z1", nome:"Recuperação", pct:"50–60% FCmáx", rpe:"2–3", met:4.5, v:"--z1"},
  2:{n:"Z2", nome:"Base aeróbica", pct:"60–70% FCmáx", rpe:"4–5", met:7.0, v:"--z2"},
  3:{n:"Z3", nome:"Tempo",        pct:"70–80% FCmáx", rpe:"6–7", met:8.5, v:"--z3"},
  4:{n:"Z4", nome:"Limiar",       pct:"80–90% FCmáx", rpe:"8",   met:10.5,v:"--z4"},
  5:{n:"Z5", nome:"VO₂máx",       pct:"90–100% FCmáx",rpe:"9–10",met:13.0,v:"--z5"}
};
const zc = z => `var(${ZONES[z].v})`;

function B(sec, z, rpm, res, pos, cue, tag){ return {s:sec, z, rpm, res, pos, cue, tag:tag||"Bloco"}; }

// aquecimento padrão de 10 min (com 3 aberturas curtas)
function warmup10(){
  const b=[
    B(180,1,"85–90","R2","Sentado plano","Solta as pernas, respiração nasal","Aquecimento"),
    B(240,2,"88–92","R3","Sentado plano","Sobe o ritmo, ombros soltos","Aquecimento")
  ];
  for(let i=0;i<3;i++){
    b.push(B(30,3,"100–105","R5","Sentado plano","Abertura — gira rápido","Aquecimento"));
    b.push(B(30,1,"85","R2","Sentado plano","Solta","Aquecimento"));
  }
  return b;
}
const cool = (sec)=>[B(sec,1,"80–90","R2","Sentado plano","Volta à calma, respiração longa","Calma")];

const W = {
  vo2:(reps,on,off)=>{
    const b=[...warmup10()];
    for(let i=1;i<=reps;i++){
      b.push(B(on*60,5,"75–85","R6–R7","Sentado subida",`Tiro ${i}/${reps} — segure o RPE 9`,"Tiro"));
      b.push(B(off*60,1,"85–90","R2–R3","Sentado plano","Recupera, baixa a FC","Recuperação"));
    }
    b.push(...cool(300));
    return {key:"vo2",nome:"VO₂ Norueguês",sub:`${reps} × ${on} min`,foco:"Potência aeróbica máxima",blocos:b};
  },
  t3015:(series,reps)=>{
    const b=[...warmup10()];
    for(let s=1;s<=series;s++){
      for(let i=1;i<=reps;i++){
        b.push(B(30,5,"100–110","R6","Sentado plano",`Série ${s} — ${i}/${reps} forte`,"Tiro"));
        b.push(B(15,1,"85","R2","Sentado plano","Solta 15 s","Recuperação"));
      }
      if(s<series) b.push(B(180,1,"85–90","R2","Sentado plano",`Fim da série ${s} — respira`,"Recuperação"));
    }

// A ofensiva é sempre derivada das datas registradas, para que marcar um dia
// atrasado recoloque a sequência no lugar em vez de somar em cima do estado antigo.
function calcOfensiva(){
  const ds = Object.keys(S.feitos).sort();
  const runs = {};
  let run=0, best=0, esc=0;
  ds.forEach((d,i)=>{
    if(i===0) run=1;
    else{
      const gap = diffDias(ds[i-1], d);
      if(gap===1) run++;
      else if(gap===2 && esc>0){ esc--; run++; }
      else run=1;
    }
    if(run%14===0 && esc<2) esc++;
    if(run>best) best=run;
    runs[d]=run;
  });
  const ultimo = ds.length ? ds[ds.length-1] : null;
  const atual = ultimo && diffDias(ultimo, hoje())<=1 ? run : 0;
  return {runs, best, esc, ultimo, atual};
}
function recalcTudo(){
  const r = calcOfensiva();
  S.recorde=r.best; S.escudos=r.esc; S.ultimo=r.ultimo; S.ofensiva=r.atual;
  let total=0;
  Object.keys(S.feitos).sort().forEach(d=>{
    const f=S.feitos[d];
    const noDia = d===dataDe(f.sem,f.dia);
    f.xp = Math.round((f.min||0) + (f.hard||0)*2 + (noDia?25:0) + Math.min((r.runs[d]||1)*3,60));
    total += f.xp;
  });
  S.xp = total;
  MEDALHAS.forEach(m=>{ if(!S.medalhas.includes(m.id) && m.ok(S)) S.medalhas.push(m.id); });
}

    rpe:extra.rpe||null, fcMed:extra.fcMed||null, fcMax:extra.fcMax||null, obs:extra.obs||""};

  if(s.key==="teste" && (extra.rpm||extra.fcRep||extra.hrr60)){
    const fRep = Number(extra.fcRep)||S.perfil.fcRep;
    const fMax = Number(extra.fcMax)||fcMax();
    if(fRep) S.perfil.fcRep=fRep;
    if(Number(extra.fcMax)) S.perfil.fcMax=Number(extra.fcMax);
    S.testes = S.testes.filter(t=>t.data!==dateStr);
    S.testes.push({data:dateStr, semana:sem, fcRep:fRep||null, fcMax:fMax||null,
      rpm:Number(extra.rpm)||null, hrr60:Number(extra.hrr60)||null, vo2:vo2est(fMax,fRep)});
    S.testes.sort((a,b)=>a.data.localeCompare(b.data));
  }
  const antes = S.medalhas.slice();
  recalcTudo();
  const novas = MEDALHAS.filter(m=>S.medalhas.includes(m.id) && antes.indexOf(m.id)<0);
  salvar();
  return {xp:S.feitos[dateStr].xp, min, kcal, novas, nome:s.nome, data:dateStr};
}
function desfazer(dateStr){
  if(!S.feitos[dateStr]) return;
  delete S.feitos[dateStr];
  S.testes = S.testes.filter(t=>t.data!==dateStr);
  recalcTudo(); salvar();
}

/* ================= UI ================= */
const el = (h)=>{ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function railHTML(s){
  const tot=secOf(s);
  return `<div class="rail">${s.blocos.map(b=>`<div style="width:${(b.s/tot*100).toFixed(3)}%;background:${zc(b.z)}"></div>`).join("")}</div>`;
}
function chips(){
  document.getElementById("chipStreak").textContent = `🔥 ${S.ofensiva}` + (S.escudos?` 🛡️${S.escudos}`:"");
  document.getElementById("chipXp").textContent = `${S.xp.toLocaleString("pt-BR")} XP`;
}

function render(){
  chips();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", String(b.dataset.tab===aba)));
  const v=document.getElementById("view"); v.innerHTML="";
  ({hoje:viewHoje, programa:viewPrograma, progresso:viewProgresso, perfil:viewPerfil})[aba](v);
  window.scrollTo(0,0);
}

  abrirSheet(`

      <div class="m"><b>${minOf(s)}</b><span>minutos</span></div>

      <div class="m"><b>${Math.round(hardMin(s))}</b><span>min Z4–Z5</span></div>
    </div>
    <div class="tscroll"><table class="blocks"><thead><tr><th>Tempo</th><th>Zona</th><th>RPM</th><th>Res.</th><th>Posição / comando</th></tr></thead><tbody>
      ${s.blocos.map(b=>{ const ini=acc; acc+=b.s; return `<tr>
        <td class="mono" style="white-space:nowrap">${mmss(ini)}<br><span class="muted">${b.s>=60?Math.round(b.s/60)+"′":b.s+"″"}</span></td>
        <td><span class="zbadge" style="background:${zc(b.z)}">${ZONES[b.z].n}</span></td>
        <td class="mono">${esc(b.rpm)}</td><td class="mono">${esc(b.res)}</td>
        <td><b>${esc(b.pos)}</b><br><span class="muted">${esc(b.cue)}</span></td></tr>`;}).join("")}
    </tbody></table></div>
    <div id="acoes" style="margin-top:16px;display:flex;flex-direction:column;gap:10px"></div>`);

  const feito=S.feitos[ds], hj=hoje(), atraso=diffDias(ds,hj);
  const box=document.getElementById("acoes");
  const add=(rot,cls,fn)=>{ const b=el(`<button class="btn ${cls}">${rot}</button>`); b.onclick=fn; box.append(b); return b; };

  if(feito){
    box.append(el(`<div class="card pad" style="background:var(--surface2)">
      <span class="eyebrow">Registrado</span>
      <div class="row small" style="gap:14px;margin-top:8px;flex-wrap:wrap">
        <span>+${feito.xp} XP</span><span>${feito.min} min</span><span>${feito.kcal} kcal</span>
        ${feito.rpe?`<span>RPE ${feito.rpe}</span>`:""}${feito.fcMed?`<span>FC ${feito.fcMed}</span>`:""}
      </div>
      ${feito.obs?`<div class="small muted" style="margin-top:8px">${esc(feito.obs)}</div>`:""}
    </div>`));
    add("Editar registro","ghost",()=>sheetConcluir(sem,dia,ds));
    add("Desfazer registro","ghost",()=>{
      abrirSheet(`<h3 style="font-size:19px">Desfazer ${esc(s.nome)} de ${fmtBR(ds)}?</h3>
        <p class="small muted">O XP e a ofensiva são recalculados.</p>
        <div class="grid2" style="margin-top:14px"><button class="btn ghost" onclick="fecharSheet()">Cancelar</button>
        <button class="btn" id="okUndo">Desfazer</button></div>`);
      document.getElementById("okUndo").onclick=()=>{ desfazer(ds); fecharSheet(); render(); };
    });
  }else if(atraso>0){
    add(`✓ Marcar como feito em ${fmtBR(ds)}`,"",()=>sheetConcluir(sem,dia,ds));
    add("▶ Fazer agora","ghost",()=>{ fecharSheet(); abrirPlayer(sem,dia,hj); });
  }else if(atraso===0){
    add("▶ Iniciar aula guiada","",()=>{ fecharSheet(); abrirPlayer(sem,dia,hj); });
    add("✓ Marcar como feito","ghost",()=>sheetConcluir(sem,dia,ds));
  }else{
    box.append(el(`<div class="small muted" style="text-align:center">Sessão de ${fmtBR(ds)}. Dá para adiantar, mas o bônus de 25 XP é só no dia certo.</div>`));
    add("▶ Fazer agora mesmo assim","ghost",()=>{ fecharSheet(); abrirPlayer(sem,dia,hj); });
  }
  add("Fechar","ghost",()=>fecharSheet());
}

function sheetConcluir(sem,dia,dateStr){
  const s=sessaoAtiva(sem,dia,dateStr), teste = s.key==="teste";
  const f=S.feitos[dateStr]||{}, tst=(S.testes||[]).find(t=>t.data===dateStr)||{};
  const atraso=diffDias(dateStr,hoje());
  const v=x=>x==null?"":x;
  abrirSheet(`
    <span class="eyebrow">${f.nome?"Editar registro":"Registrar"} · ${DIAS[dia]} ${fmtBR(dateStr)}</span>
    <h3 style="font-size:22px;margin:6px 0 4px">${esc(s.nome)}</h3>
    <div class="small muted" style="margin-bottom:12px">${minOf(s)} min · ${kcalOf(s,S.perfil.peso||102)} kcal${atraso>0?` · registro retroativo de ${atraso} dia${atraso>1?"s":""} atrás`:""}</div>
    <div class="grid2">
      <label class="f"><span>RPE (1–10)</span><input id="rRpe" type="number" min="1" max="10" inputmode="numeric" value="${v(f.rpe)}"></label>
      <label class="f"><span>FC média</span><input id="rFcm" type="number" inputmode="numeric" value="${v(f.fcMed)}"></label>
      <label class="f"><span>FC máxima</span><input id="rFcx" type="number" inputmode="numeric" value="${v(f.fcMax)}"></label>
      ${teste?`<label class="f"><span>FC repouso (manhã)</span><input id="rFcr" type="number" inputmode="numeric" value="${v(tst.fcRep)}"></label>`:""}
    </div>
    ${teste?`<div class="grid2">
      <label class="f"><span>RPM médio 12 min</span><input id="rRpm" type="number" inputmode="numeric" value="${v(tst.rpm)}"></label>
      <label class="f"><span>Queda de FC em 60 s</span><input id="rHrr" type="number" inputmode="numeric" value="${v(tst.hrr60)}"></label>
    </div>`:""}
    <label class="f"><span>Observações</span><textarea id="rObs" placeholder="Como foi, pernas, sono, o que ajustar">${esc(f.obs||"")}</textarea></label>
    <button class="btn" id="rOk">${f.nome?"Salvar alterações":"Concluir e ganhar XP"}</button>`);
  document.getElementById("rOk").onclick=()=>{
    const g=id=>{const e=document.getElementById(id); return e? e.value.trim():"";};
    const r=concluir(dateStr,sem,dia,{rpe:g("rRpe"),fcMed:g("rFcm"),fcMax:g("rFcx"),
      fcRep:g("rFcr"),rpm:g("rRpm"),hrr60:g("rHrr"),obs:g("rObs")});
    celebrar(r);
  };
}

function celebrar(r){
  const atras = r.data && r.data!==hoje();
  abrirSheet(`
    <div class="celebrate">
      <div class="big pulse">+${r.xp} XP</div>
      <div style="margin-top:4px">${esc(r.nome)} · ${r.min} min · ${r.kcal} kcal</div>
      ${atras?`<div class="small muted" style="margin-top:4px">Registrado em ${fmtBR(r.data)}</div>`:""}
      <div class="row" style="justify-content:center;gap:16px;margin-top:14px">
        <span class="chip flame">🔥 ${S.ofensiva} ${S.ofensiva===1?"dia":"dias"}</span>
        <span class="chip">Nível ${nivel(S.xp).n} · ${nivel(S.xp).nome}</span>
      </div>
      ${r.novas.length?`<div style="margin-top:18px"><span class="eyebrow">Nova medalha</span>
        <div class="badges" style="margin-top:10px">${r.novas.map(m=>`<div class="badge on"><div class="ic">${m.ic}</div><b>${m.t}</b><i>${m.d}</i></div>`).join("")}</div></div>`:""}
    </div>
    <button class="btn" style="margin-top:18px" id="cOk">Fechar</button>`);
  document.getElementById("cOk").onclick=()=>{ fecharSheet(); render(); };
}

/* ================= PLAYER ================= */
let P={sem:0,dia:0,ds:null,s:null,i:0,left:0,rodando:false,t:null,restante:0,total:0,lock:null,ctx:null,
       avisou:false,ultMot:0,motIdx:0,falouMeio:false};

function falar(txt){
  if(!S.opts.voz || !txt) return;
  try{
    const u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=1.06; u.pitch=1;
    const v=(speechSynthesis.getVoices()||[]).find(x=>/pt[-_]?BR/i.test(x.lang))||null;
    if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
function frase(b){
  const pool = FRASES[b.tag] || FRASES.Bloco;
  P.motIdx = (P.motIdx+1) % pool.length;
  return pool[P.motIdx];
}
function beep(freq,dur,vol){
  if(!S.opts.bipe) return;
  try{
    if(!P.ctx) P.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=P.ctx.createOscillator(), g=P.ctx.createGain();
    o.type="sine"; o.frequency.value=freq; g.gain.value=vol||0.14;
    o.connect(g); g.connect(P.ctx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001,P.ctx.currentTime+dur);
    o.stop(P.ctx.currentTime+dur);
  }catch(e){}
}

async function abrirPlayer(sem,dia,ds){
  P.sem=sem; P.dia=dia; P.ds=ds||hoje(); P.s=sessaoAtiva(sem,dia,P.ds);
  P.i=0; P.left=P.s.blocos[0].s; P.total=secOf(P.s); P.restante=P.total; P.rodando=true;
  P.avisou=false; P.ultMot=0; P.motIdx=-1; P.falouMeio=false;
  document.getElementById("pName").textContent=P.s.nome;
  document.getElementById("pDur").textContent=mmss(P.total);
  document.getElementById("pPrep").classList.remove("on");
  const rail=document.getElementById("pRail"); rail.innerHTML="";
  const tot=secOf(P.s);
  P.s.blocos.forEach(b=>{ const d=document.createElement("div");
    d.style.width=`calc(${(b.s/tot*100).toFixed(3)}% - 2px)`; d.style.background=zc(b.z); d.style.color=zc(b.z); rail.append(d); });
  document.getElementById("player").classList.add("on");
  document.getElementById("pPlay").textContent="Pausar";
  try{ if(navigator.wakeLock) P.lock=await navigator.wakeLock.request("screen"); }catch(e){}
  try{ if(!P.ctx) P.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(P.ctx.state==="suspended") P.ctx.resume(); }catch(e){}
  try{ if(S.opts.voz && window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){}
  pintar(); anunciar(P.s.blocos[0]); relogio();
}
function anunciar(b){
  const rpm=num1(b.rpm), res=num1(b.res);
  let t=b.cue;
  if(rpm) t+=`. ${rpm} rotações`;
  if(res) t+=`, resistência ${res}`;
  falar(t);
}
function mostrarFrase(b,forcar){
  if(!S.opts.frases) return;
  const m=document.getElementById("pMot");
  const nova=frase(b);
  m.style.opacity="0";
  setTimeout(()=>{ m.textContent=nova; m.style.opacity="1"; },180);
  if(forcar) falar(nova);
}
function fecharPlayer(){
  P.rodando=false; clearInterval(P.t); P.t=null;
  document.getElementById("pPrep").classList.remove("on");
  document.getElementById("player").classList.remove("on");
  try{ if(P.lock) P.lock.release(); }catch(e){} P.lock=null;
}
function pintar(){
  const b=P.s.blocos[P.i], z=ZONES[b.z];
  document.getElementById("pTag").textContent=`${b.tag} · ${z.n} ${z.nome}`;
  document.getElementById("pTag").style.background=zc(b.z);
  document.getElementById("pTime").textContent=mmss(P.left);
  document.getElementById("pCue").textContent=b.cue;
  document.getElementById("pRpm").textContent=b.rpm;
  document.getElementById("pRes").textContent=b.res;
  const alvo=fcAlvo(b.z);
  document.getElementById("pZone").textContent=alvo?alvo:z.n;
  document.getElementById("pBlockBar").parentElement.style.color=zc(b.z);
  const prox=P.s.blocos[P.i+1];
  document.getElementById("pNext").textContent = prox? `Depois: ${prox.pos} · ${prox.rpm} rpm · ${prox.res} · ${prox.s>=60?Math.round(prox.s/60)+" min":prox.s+" s"}` : "Último bloco — fecha forte";
  document.querySelector("#player .pglow").style.background=`radial-gradient(70% 50% at 50% 42%, ${zc(b.z)} 0%, transparent 70%)`;
  const ds=document.querySelectorAll("#pRail div");
  ds.forEach((d,i)=>{ d.classList.toggle("done",i<P.i); d.classList.toggle("now",i===P.i); });
  mostrarFrase(b,false); P.ultMot=P.total-P.restante;
  tempos();
}
function tempos(){
  const dec=Math.max(0,P.total-P.restante);
  document.getElementById("pElapsed").textContent=mmss(Math.floor(dec));
  document.getElementById("pProg").style.width=(dec/P.total*100).toFixed(2)+"%";
  const b=P.s.blocos[P.i];
  document.getElementById("pBlockBar").style.width=(Math.max(0,(b.s-P.left))/b.s*100).toFixed(2)+"%";
}
function prepararTransicao(seg){
  const b=P.s.blocos[P.i], prox=P.s.blocos[P.i+1];
  const box=document.getElementById("pPrep");
  if(!prox){ box.classList.remove("on"); return; }
  if(!P.avisou){
    P.avisou=true;
    const instr=instrucaoTransicao(b,prox);
    document.getElementById("pPrepInstr").textContent=instr;
    document.getElementById("pPrepDet").textContent=`${prox.rpm} rpm · ${prox.res} · ${prox.pos}`;
    box.style.color=zc(prox.z);
    box.classList.add("on");
    falar(`Prepara. ${instr.toLowerCase().replace(/\+/g," e ")}.`);
  }
  document.getElementById("pPrepNum").textContent=Math.max(0,seg);
}
function relogio(){
  clearInterval(P.t);
  let ultimo=Date.now();
  P.t=setInterval(()=>{
    if(!P.rodando){ ultimo=Date.now(); return; }
    const agora=Date.now(), dt=(agora-ultimo)/1000; ultimo=agora;
    const b=P.s.blocos[P.i];
    const antes=Math.ceil(P.left);
    P.left-=dt; P.restante=Math.max(0,P.restante-dt);
    const depois=Math.ceil(P.left);

    // aviso de transição
    const janela = b.s>=90 ? 10 : (b.s>=40 ? 5 : 3);
    if(depois<=janela && depois>0 && P.s.blocos[P.i+1]) prepararTransicao(depois);
    if(antes>depois && depois<=5 && depois>0) beep(660,0.08,0.12);

    // frase no meio de blocos longos
    if(b.s>=150 && !P.falouMeio && (b.s-P.left)>=b.s/2){ P.falouMeio=true; mostrarFrase(b,true); }
    const dec=P.total-P.restante;
    if(S.opts.frases && b.s>=120 && dec-P.ultMot>=25){ P.ultMot=dec; mostrarFrase(b,false); }

    if(P.left<=0){ avancar(true); return; }
    document.getElementById("pTime").textContent=mmss(Math.ceil(P.left));
    tempos();
  },200);
}
function avancar(auto){
  if(P.i>=P.s.blocos.length-1){ terminar(); return; }
  if(!auto) P.restante=Math.max(0,P.restante-P.left);
  P.i++; P.left=P.s.blocos[P.i].s;
  P.avisou=false; P.falouMeio=false;
  document.getElementById("pPrep").classList.remove("on");
  const b=P.s.blocos[P.i];
  beep(b.z>=4?920:480, b.z>=4?0.30:0.18, 0.18);
  pintar(); anunciar(b);
}
function terminar(){
  falar("Acabou. Bom treino.");
  fecharPlayer();
  sheetConcluir(P.sem,P.dia,P.ds||hoje());
}
document.getElementById("pPlay").onclick=()=>{
  P.rodando=!P.rodando;
  document.getElementById("pPlay").textContent=P.rodando?"Pausar":"Continuar";
  try{ if(!P.rodando) speechSynthesis.cancel(); }catch(e){}
};
document.getElementById("pSkip").onclick=()=>avancar(false);
document.getElementById("pQuit").onclick=()=>{
  abrirSheet(`<h3 style="font-size:19px">Encerrar a aula?</h3><p class="small muted">Você pode registrar do mesmo jeito, com o que já fez.</p>
    <div class="grid2" style="margin-top:14px"><button class="btn ghost" onclick="fecharSheet()">Voltar</button>
    <button class="btn" id="qOk">Encerrar</button></div>`);
  document.getElementById("qOk").onclick=()=>{ fecharSheet(); fecharPlayer(); render(); };
};

/* ================= BOOT ================= */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ aba=b.dataset.tab; render(); });
function migrar(){
  let mudou=false;
  Object.keys(S.feitos).forEach(d=>{
    const f=S.feitos[d];
    if(f.hard==null){
      try{ f.hard=Math.round(hardMin(sessaoAtiva(f.sem,f.dia,d))); }catch(e){ f.hard=0; }
      mudou=true;
    }
  });
  recalcTudo();
  if(mudou) salvar();
}
(async ()=>{ await carregar(); migrar(); render(); })();
</script>
